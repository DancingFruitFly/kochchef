services:
  rezeptplaner:
    build: .
    image: rezeptplaner
    container_name: rezeptplaner
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      MONGODB_URI: "mongodb://mongodb/nest"
  mongodb-community-server:
