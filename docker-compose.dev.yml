services:
  mongo:
    image: mongo:7
    container_name: kochchef_mongo_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: kochchef_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://root:example@mongo:27017/kochchef?authSource=admin
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: kochchef_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules: